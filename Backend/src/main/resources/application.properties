# =========================================================
# ParkEase Backend - application.properties
# =========================================================

# Import local .env file if it exists
spring.config.import=optional:file:.env[.properties]

# Server
server.port=${PORT:8081}

# =========================================================
# PostgreSQL / Supabase Session Pooler
# =========================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000


# =========================================================
# JPA / Hibernate
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =========================================================
# Jackson
# =========================================================

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata

# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# =========================================================
# Logging
# =========================================================

logging.level.com.demo.parkease=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# =========================================================
# Groq AI Chatbot
# =========================================================

groq.api.key=${GROQ_API_KEY}
groq.model=${GROQ_MODEL:qwen/qwen3.8-27b}

# =========================================================
# Document Upload — Owner Applications
# =========================================================

# Directory for storing owner verification documents
# Change to an absolute path in production (e.g. /var/parkease/uploads/owner-docs)
app.document.upload-dir=${DOCUMENT_UPLOAD_DIR:./uploads/owner-docs}

# Spring multipart file upload limits (10 MB per file, 40 MB total)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=40MB